<div class="drawer__header">
  <h2>Tạo ký ức bằng địa điểm</h2>

  <button type="button" data-close-drawer aria-label="Đóng">
    ✕
  </button>
</div>

<form id="memory-form" novalidate>
  <label class="field">
    Tìm địa điểm
    <input
      id="location-query"
      type="search"
      maxlength="200"
      placeholder="Ví dụ: Hồ Gươm"
    >
  </label>

  <button id="location-search" class="button" type="button">
    Tìm kiếm
  </button>

  <p class="muted">
    Chỉ nhập tên địa điểm, không nhập thông tin cá nhân.
  </p>

  <p id="location-message" role="status"></p>
  <div id="location-results"></div>

  <small>
    Dữ liệu địa điểm ©
    <a
      href="https://www.openstreetmap.org/copyright"
      target="_blank"
      rel="noopener"
    >OpenStreetMap contributors</a>
  </small>

  <label class="field">
    Tên địa điểm
    <input name="place_name" maxlength="255" required>
  </label>

  <input name="latitude" type="hidden">
  <input name="longitude" type="hidden">

  <p id="memory-coords">Chưa chọn vị trí.</p>

  <label class="field">
    Tiêu đề
    <input name="title" maxlength="200" required>
  </label>

  <label class="field">
    Ngày diễn ra
    <input name="memory_date" type="date" required>
  </label>

  <label class="field">
    Câu chuyện
    <textarea
      name="content"
      rows="8"
      maxlength="100000"
    ></textarea>
  </label>

  <p>
    Chế độ lưu: <strong>Riêng tư</strong> — chỉ bạn xem được.
  </p>

  <p class="form-message" role="alert" hidden></p>

  <button class="button button--primary" type="submit">
    Lưu ký ức
  </button>
</form>
