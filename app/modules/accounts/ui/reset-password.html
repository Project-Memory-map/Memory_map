<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">

  <title>Đặt lại mật khẩu · Bản đồ Ký ức</title>

  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/accounts/accounts.css">
</head>

<body class="auth-page">
  <main class="auth-card">
    <h1>Đặt lại mật khẩu</h1>

    <p class="muted">
      Mật khẩu mới phải có ít nhất 8 ký tự, gồm chữ và số.
    </p>

    <form
      class="form"
      data-endpoint="/api/auth/reset-password"
      data-with-token
      data-success="Đã đặt lại mật khẩu, bạn có thể đăng nhập bằng mật khẩu mới"
    >
      <label class="field">
        Mật khẩu mới

        <input
          type="password"
          name="new_password"
          minlength="8"
          autocomplete="new-password"
          required
        >
      </label>

      <label class="field">
        Nhập lại mật khẩu mới

        <input
          type="password"
          name="password_confirm"
          autocomplete="new-password"
          required
        >
      </label>

      <p
        class="form-message"
        role="status"
        aria-live="polite"
        hidden
      ></p>

      <button class="button" type="submit">
        Đặt lại mật khẩu
      </button>
    </form>

    <p class="auth-links">
      <a href="/accounts/login.html">
        Đến trang đăng nhập
      </a>
      ·
      <a href="/accounts/forgot-password.html">
        Yêu cầu liên kết mới
      </a>
    </p>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/accounts/accounts.js"></script>
</body>
</html>
